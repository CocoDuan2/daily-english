<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<title>Talkini 亲子日常英语</title>
<style>
:root{
  --animal-font:'Nunito','Noto Sans SC',-apple-system,'PingFang SC','Hiragino Sans GB',sans-serif;
  --animal-primary:#14a08f;--animal-primary-hover:#37b7a7;--animal-primary-active:#0c8b7c;--animal-primary-bg:#e4f4f1;--animal-primary-ink:#0b8577;
  --animal-text:#00214d;--animal-text-body:#1b2d45;--animal-text-secondary:#7a5c2e;--animal-text-muted:#6b6459;--animal-text-disabled:#9a9182;
  --animal-bg:#f6f2e9;--animal-bg-content:#fbf6ea;--animal-bg-disabled:#e6dfcc;
  --animal-border:#ebdfc6;--animal-border-hover:#d8c9a4;
  --animal-divider:#ebe2ce;--animal-divider-mint:#d5e9e3;
  --animal-radius-sm:12px;--animal-radius:18px;--animal-radius-lg:24px;--animal-radius-pill:50px;
  --animal-shadow-btn:#ebdfc6;--animal-shadow-input:#ebe2ce;
  --animal-focus-yellow:#fde24f;--animal-success:#14a08f;--animal-success-ink:#0b8577;--animal-warning:#fde24f;--animal-error:#e86a86;
  --animal-ease:cubic-bezier(.4,0,.2,1);--animal-duration-fast:.15s;--animal-duration:.25s;--animal-duration-slow:.35s;
}
*{box-sizing:border-box}
body{margin:0;background:var(--animal-bg);color:var(--animal-text-body);font-family:var(--animal-font);font-weight:500;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.icon{display:inline-flex;width:100%;height:100%;align-items:center;justify-content:center}
.icon svg{width:100%;height:100%;display:block}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--animal-bg);display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--animal-bg);border-bottom:1px solid var(--animal-border)}
.brand-icon{width:42px;height:42px;border-radius:13px;background:var(--animal-primary-bg);padding:5px;flex:none;overflow:hidden}
.brand-logo{width:100%;height:100%;object-fit:contain;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.brand-text strong{font-size:17px;font-weight:700;color:var(--animal-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text small{font-size:12px;color:var(--animal-text-secondary)}
.appbar-title{margin:0;font-size:17px;font-weight:700;color:var(--animal-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-back{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 14px 0 8px;border-radius:var(--animal-radius-pill);background:var(--animal-bg-content);color:var(--animal-text);font-weight:600;font-size:14px;border:1.5px solid var(--animal-border);flex:none;transition:all var(--animal-duration) var(--animal-ease)}
.app-back .icon{width:18px;height:18px}
.app-back:hover{background:var(--animal-primary-bg);border-color:var(--animal-primary)}
.app-back:focus-visible,.theme-card:focus-visible,.scene-link:focus-visible,.rec-scene:focus-visible,.ghost:focus-visible,.tab:focus-visible{outline:3px solid var(--animal-focus-yellow);outline-offset:2px}
.screen{flex:1;padding:16px;display:flex;flex-direction:column;gap:20px}
.hero{background:var(--animal-bg-content);border:1.5px solid var(--animal-border);border-radius:var(--animal-radius-lg);padding:22px 20px}
.hero h1{margin:0 0 8px;font-size:23px;font-weight:800;color:var(--animal-text);line-height:1.3}
.hero p{margin:0;font-size:14px;line-height:1.65;color:var(--animal-text-body)}
/* 首页问候卡：装饰小图，让首屏不空 */
/* 首页今日卡：问候语 + 今日推荐合成一张卡 */
.today-card{position:relative;overflow:hidden;background:linear-gradient(168deg,#fdf8ec 0%,#fbf6ea 100%);border:1px solid var(--animal-divider-mint);border-radius:26px;padding:20px 18px 18px;box-shadow:0 14px 30px -24px rgba(120,92,32,.18)}
.today-head{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px}
.today-copy{flex:1;min-width:0}
.today-copy h1{margin:0 0 6px;font-size:22px;font-weight:800;color:var(--animal-text);line-height:1.3}
.today-copy p{margin:0;font-size:13.5px;line-height:1.6;color:var(--animal-text-body)}
.today-art{flex:none;width:76px;height:76px;margin-top:-2px}
.today-art svg{display:block;width:100%;height:100%}
.hero .count-line{margin-top:10px;font-size:12.5px;color:var(--animal-text-muted)}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:baseline;gap:5px;background:var(--animal-primary-bg);color:var(--animal-text);font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--animal-radius-pill)}
.stat b{font-size:18px;font-weight:800;color:var(--animal-primary-ink)}
.section-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px;font-weight:700;color:var(--animal-text)}
.section-head::before{content:'';width:5px;height:18px;border-radius:3px;background:var(--animal-primary)}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.theme-card{display:flex;flex-direction:column;gap:8px;background:var(--animal-bg-content);border:1.5px solid var(--animal-border);border-radius:var(--animal-radius);padding:14px;transition:transform var(--animal-duration) var(--animal-ease),border-color var(--animal-duration) var(--animal-ease)}
.theme-card:hover{transform:translateY(-2px);border-color:var(--animal-primary)}
.theme-icon{width:40px;height:40px;border-radius:var(--animal-radius-sm);background:var(--animal-bg);padding:7px;flex:none}
.theme-icon.big{width:56px;height:56px;padding:9px;border-radius:16px}
.theme-name{font-size:15px;font-weight:700;color:var(--animal-text);line-height:1.35}
.theme-count{font-size:12px;color:var(--animal-text-secondary)}
.theme-count.has{color:var(--animal-primary-ink);font-weight:600}
.scene-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.scene-item{background:var(--animal-bg-content);border:1.5px solid var(--animal-border);border-radius:var(--animal-radius);overflow:hidden}
.scene-link{display:flex;flex-direction:column;gap:6px;padding:16px 18px 14px;transition:background var(--animal-duration) var(--animal-ease)}
.scene-link:hover{background:var(--animal-primary-bg)}
.scene-theme{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--animal-primary-ink);background:var(--animal-primary-bg);padding:3px 10px;border-radius:var(--animal-radius-pill)}
.scene-link strong{font-size:17px;font-weight:700;color:var(--animal-text);line-height:1.4}
.scene-intent{font-size:13.5px;color:var(--animal-text-body);line-height:1.6}
.scene-meta{font-size:12px;color:var(--animal-text-secondary)}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--animal-text-muted);background:var(--animal-bg-content);border:2px dashed var(--animal-divider);border-radius:var(--animal-radius);padding:34px 20px;font-size:13.5px;line-height:1.7}
.empty .icon{width:44px;height:44px}
.theme-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.theme-hero h1{margin:0;font-size:21px;font-weight:800;color:var(--animal-text)}
.theme-hero p{margin:0;font-size:13.5px;color:var(--animal-text-body)}
.tabbar{position:sticky;bottom:0;z-index:5;display:flex;background:var(--animal-bg-content);border-top:1.5px solid var(--animal-border);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:var(--animal-radius-sm);font-size:11.5px;font-weight:600;color:var(--animal-text-secondary);transition:all var(--animal-duration) var(--animal-ease)}
.tab .icon{width:22px;height:22px;border-radius:var(--animal-radius-pill);transition:background var(--animal-duration) var(--animal-ease),box-shadow var(--animal-duration) var(--animal-ease)}
.tab:hover{background:var(--animal-primary-bg);color:var(--animal-text)}
.tab.active{color:var(--animal-primary-ink)}
.tab.active .icon{background:var(--animal-primary-bg);box-shadow:0 0 0 6px var(--animal-primary-bg)}
@media(min-width:560px){.theme-grid{grid-template-columns:repeat(3,1fr)}}
.today-body{margin-top:14px}
.rec-line{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.rec-cat{font-size:12px;font-weight:700;color:var(--animal-primary-ink);background:var(--animal-bg-content);border:1px solid var(--animal-divider-mint);border-radius:var(--animal-radius-pill);padding:4px 10px;white-space:nowrap}
.rec-tag{font-size:12px;font-weight:700;color:var(--animal-text-secondary);letter-spacing:.04em;white-space:nowrap}
.rec-time{margin-left:auto;font-size:12px;color:var(--animal-text-secondary);white-space:nowrap;font-variant-numeric:tabular-nums}
.rec-scene{display:flex;align-items:center;gap:12px;background:var(--animal-bg-content);border:1px solid var(--animal-border);border-radius:var(--animal-radius);padding:12px;box-shadow:0 8px 18px -16px rgba(120,92,32,.2);transition:border-color var(--animal-duration) var(--animal-ease),background var(--animal-duration) var(--animal-ease),transform var(--animal-duration-fast) var(--animal-ease)}
.rec-scene:hover{border-color:var(--animal-primary);background:var(--animal-primary-bg)}
.rec-scene:active{transform:scale(.985)}
.rec-scene:focus-visible{outline:3px solid var(--animal-focus-yellow);outline-offset:2px}
.rec-icon{flex:none;width:44px;height:44px;padding:9px;border-radius:var(--animal-radius-sm);background:var(--animal-primary-bg)}
.rec-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rec-en{font-size:12px;font-weight:700;color:var(--animal-text-secondary);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-zh{font-size:20px;font-weight:800;color:var(--animal-text);line-height:1.25}
.rec-go{flex:none;display:inline-flex;width:34px;height:34px;padding:8px;border-radius:50%;background:var(--animal-primary-bg);transition:background var(--animal-duration) var(--animal-ease)}
.rec-go svg{transform:rotate(180deg)}
.rec-scene:hover .rec-go{background:var(--animal-primary)}
.rec-preview{margin-top:12px;border-top:1px dashed var(--animal-divider-mint);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.rec-pv-li{display:flex;gap:8px;font-size:13.5px;line-height:1.5;color:var(--animal-text-body)}
.rec-pv-li b{flex:none;width:14px;font-weight:800;color:var(--animal-primary-ink)}
.home-empty{display:flex;align-items:center;gap:12px;background:var(--animal-bg-content);border:1px solid var(--animal-border);border-radius:var(--animal-radius);padding:14px 16px}
.home-empty .icon{flex:none;width:32px;height:32px;color:var(--animal-primary-ink)}
.home-empty-txt{flex:1;min-width:0;font-size:13.5px;line-height:1.5;color:var(--animal-text-body)}
.tomorrow-list{list-style:none;margin:0;padding:0}
.tomorrow-card{margin:0}
.tmr-link{display:flex;align-items:center;gap:12px;background:var(--animal-bg-content);border:1px solid var(--animal-border);border-radius:var(--animal-radius);padding:14px 16px;transition:border-color var(--animal-duration) var(--animal-ease),background var(--animal-duration) var(--animal-ease),transform var(--animal-duration-fast) var(--animal-ease)}
.tmr-link:hover{border-color:var(--animal-primary);background:var(--animal-primary-bg)}
.tmr-link:active{transform:scale(.985)}
.tmr-link:focus-visible{outline:3px solid var(--animal-focus-yellow);outline-offset:2px}
.tmr-icon{flex:none;width:44px;height:44px;padding:9px;border-radius:var(--animal-radius-sm);background:var(--animal-primary-bg)}
.tmr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tmr-label{font-size:12px;font-weight:700;color:var(--animal-text-secondary);letter-spacing:.02em}
.tmr-name{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:15.5px;font-weight:800;color:var(--animal-text);line-height:1.3}
.tmr-name>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmr-en{flex:0 1 auto;font-size:11.5px;font-weight:700;color:var(--animal-text-muted);letter-spacing:.05em;text-transform:uppercase}
.ghost{flex:none;border:1px solid var(--animal-primary-ink);color:var(--animal-primary-ink);background:var(--animal-bg-content);border-radius:var(--animal-radius-pill);padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;transition:background var(--animal-duration) var(--animal-ease),border-color var(--animal-duration) var(--animal-ease)}
.ghost:hover{background:var(--animal-primary-bg);border-color:var(--animal-primary)}
.ghost:focus-visible{outline:3px solid var(--animal-focus-yellow);outline-offset:2px}
.progress-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.progress-row{display:flex;align-items:center;gap:12px;background:var(--animal-bg-content);border:1.5px solid var(--animal-border);border-radius:var(--animal-radius);padding:12px 14px}
.progress-icon{width:34px;height:34px;border-radius:var(--animal-radius-sm);background:var(--animal-bg);padding:6px;flex:none}
.progress-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0}
.progress-name{font-size:14px;font-weight:700;color:var(--animal-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress-count{font-size:12px;font-weight:600;color:var(--animal-text-secondary);flex:none}
.progress-count.has{color:var(--animal-primary-ink)}
.progress-bar{height:7px;border-radius:4px;background:var(--animal-bg-disabled);overflow:hidden}
.progress-bar span{display:block;height:100%;border-radius:4px;background:var(--animal-primary);transition:width var(--animal-duration-slow) var(--animal-ease)}

</style>
</head>

003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#00214d\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\u003crect x=\"7\" y=\"21\" width=\"7\" height=\"17\" rx=\"2\" fill=\"#14a08f\"/>\n\u003cpath d=\"M16 38 L 16 23 L 23 12 C 25 9.5 27.5 11 26.5 14 L 24.5 20 L 33 20 C 36.5 20 38 22.5 37 25.5 L 34 35 C 33.3 37 31.8 38 29.5 38 Z\" fill=\"#fde24f\"/>\n\u003c/svg>\u003c/span>", "train": "\u003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#00214d\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\u003crect x=\"7\" y=\"18\" width=\"26\" height=\"15\" rx=\"3\" fill=\"#e86a86\"/>\n\u003crect x=\"25\" y=\"9\" width=\"12\" height=\"13\" rx=\"2\" fill=\"#14a08f\"/>\n\u003crect x=\"28\" y=\"12\" width=\"6\" height=\"5\" fill=\"#fffffe\"/>\n\u003crect x=\"10\" y=\"10\" width=\"6\" height=\"8\" fill=\"#00214d\"/>\n\u003ccircle cx=\"13\" cy=\"6\" r=\"2.5\" fill=\"#fffffe\"/>\n\u003crect x=\"5\" y=\"33\" width=\"36\" height=\"4\" fill=\"#00214d\"/>\n\u003ccircle cx=\"13\" cy=\"40\" r=\"4\" fill=\"#fde24f\"/>\n\u003ccircle cx=\"24\" cy=\"40\" r=\"4\" fill=\"#fde24f\"/>\n\u003ccircle cx=\"35\" cy=\"40\" r=\"4\" fill=\"#fde24f\"/>\n\u003ccircle cx=\"13\" cy=\"40\" r=\"1.5\" fill=\"#00214d\"/>\n\u003ccircle cx=\"24\" cy=\"40\" r=\"1.5\" fill=\"#00214d\"/>\n\u003ccircle cx=\"35\" cy=\"40\" r=\"1.5\" fill=\"#00214d\"/>\n\u003c/svg>\u003c/span>", "tree": "\u003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#00214d\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\u003ccircle cx=\"24\" cy=\"18\" r=\"14\" fill=\"#14a08f\"/>\n\u003crect x=\"20\" y=\"30\" width=\"8\" height=\"12\" fill=\"#00214d\"/>\n\u003ccircle cx=\"20\" cy=\"16\" r=\"1.5\" fill=\"#00214d\"/>\n\u003ccircle cx=\"28\" cy=\"16\" r=\"1.5\" fill=\"#00214d\"/>\n\u003c/svg>\u003c/span>", "users": "\u003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#00214d\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\u003ccircle cx=\"15\" cy=\"14\" r=\"6\" fill=\"#00214d\"/>\n\u003cpath d=\"M5 34 C 5 26 9 23 15 23 C 19 23 22 24 24 26 L 24 40 L 8 40 Z\" fill=\"#00214d\"/>\n\u003ccircle cx=\"29\" cy=\"18\" r=\"7.5\" fill=\"#e86a86\"/>\n\u003cpath d=\"M14 42 C 14 33 21 30 29 30 C 37 30 43 33 43 42 Z\" fill=\"#14a08f\"/>\n\u003ccircle cx=\"26.5\" cy=\"18\" r=\"1.5\" fill=\"#00214d\"/>\n\u003ccircle cx=\"31.5\" cy=\"18\" r=\"1.5\" fill=\"#00214d\"/>\n\u003cpath d=\"M26 22 Q 29 24.5 32 22\" stroke=\"#00214d\" fill=\"none\"/>\n\u003c/svg>\u003c/span>", "water-cup": "\u003cspan class=\"icon\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 48 48\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" stroke=\"#00214d\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n\u003cpath d=\"M13 12 L16 39 C 16.5 41.5 31.5 41.5 32 39 L35 12 Z\" fill=\"#fffffe\"/>\n\u003cpath d=\"M15.8 24 C 21 22.5 27 25.5 32.2 24 L 30.6 35 C 30.2 37.5 17.8 37.5 17.4 35 Z\" fill=\"#14a08f\"/>\n\u003cpath d=\"M28 11 L31.5 4\" stroke=\"#e86a86\" stroke-width=\"3\"/>\n\u003ccircle cx=\"22\" cy=\"29\" r=\"1.6\" fill=\"#00214d\"/>\n\u003ccircle cx=\"25.5\" cy=\"32.5\" r=\"1.2\" fill=\"#00214d\"/>\n\u003c/svg>\u003c/span>"}}</script>
<script>/* 本地离线进度：已完成场景存在浏览器 localStorage，不上传。 */
(function () {
  'use strict';
  var KEY = 'tde.v1.done';
  function read() {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return {};
      var obj = JSON.parse(raw);
      return obj && typeof obj === 'object' ? obj : {};
    } catch (e) { return {}; }
  }
  function write(obj) {
    try { window.localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* 场景页：完成开关 */
  var toggle = document.querySelector('[data-done-scene]');
  if (toggle) {
    var file = toggle.getAttribute('data-done-scene');
    var label = toggle.querySelector('[data-done-label]');
    var paint = function () {
      var on = !!read()[file];
      toggle.classList.toggle('is-done', on);
      toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (label) label.textContent = on ? '已完成' : '标记为完成';
    };
    toggle.addEventListener('click', function () {
      var obj = read();
      if (obj[file]) delete obj[file]; else obj[file] = Date.now();
      write(obj);
      paint();
    });
    paint();
    return;
  }

  /* 应用页：按完成情况刷新首页、主题、我的 */
  var dataEl = document.getElementById('tde-data');
  if (!dataEl) return;
  var data, done;
  try { data = JSON.parse(dataEl.textContent); } catch (e) { return; }
  if (!data) return;
  done = read();
  var themes = data.themes || [];
  var scenes = data.scenes || [];
  var icons = data.icons || {};
  var root = data.root || '';
  var byId = {};
  themes.forEach(function (t) { byId[t.id] = t; });

  var completed = scenes.filter(function (s) { return done[s.file]; })
    .map(function (s) { return { s: s, ts: Number(done[s.file]) || 0 }; })
    .sort(function (a, b) { return b.ts - a.ts; });
  var completedScenes = completed.map(function (c) { return c.s; });

  /* 今日推荐：最早加入、尚未完成的一条；没有场景时先按日期给一个主题。
     先在前面算好，供首页今日卡与空状态按钮共用同一个入口。 */
  var nextScene = null;
  for (var nsi = scenes.length - 1; nsi >= 0; nsi--) {
    if (!done[scenes[nsi].file]) { nextScene = scenes[nsi]; break; }
  }
  /* 还没有任何场景时，用「距 1970-01-01 的天数」轮换一个待生成的主题，
     和服务端 starter_recommendation() 用同一套算法。 */
  var dayIndex = (function () {
    var stamp = String(data.today || '').split('-');
    if (stamp.length === 3) return Math.floor(Date.UTC(+stamp[0], +stamp[1] - 1, +stamp[2]) / 86400000);
    return Math.floor(Date.now() / 86400000);
  })();
  var starterTheme = (!scenes.length && themes.length) ? themes[dayIndex % themes.length] : null;
  var todayHref = root + 'themes.html';
  if (nextScene) todayHref = root + 'pages/' + encodeURIComponent(nextScene.file);
  else if (starterTheme) todayHref = root + 'themes/' + starterTheme.page;

  var counts = {};
  completed.forEach(function (c) { counts[c.s.theme] = (counts[c.s.theme] || 0) + 1; });
  var covered = themes.filter(function (t) { return counts[t.id]; }).length;
  /* 每个主题已归档的场景数，用来兜底分母 */
  var archived = {};
  scenes.forEach(function (s) { archived[s.theme] = (archived[s.theme] || 0) + 1; });
  function themeTotal(theme, doneCount) {
    return Math.max(archived[theme.id] || 0, doneCount || 0);
  }

  function setStat(name, value) {
    var nodes = document.querySelectorAll('[data-stat="' + name + '"]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = value;
  }
  setStat('scenes', completed.length);
  setStat('themes', covered);
  var days = {};
  completed.forEach(function (c) { days[c.s.date] = 1; });
  setStat('days', Object.keys(days).length);

  function listItem(s) {
    var meta = esc(s.date) + (s.targets ? ' · 跟读 ' + s.targets + ' 条' : '');
    return '<li class="scene-item">' +
      '<a class="scene-link" href="' + root + 'pages/' + encodeURIComponent(s.file) + '">' +
      '<span class="scene-theme">' + esc(s.themeName) + '</span>' +
      '<strong>' + esc(s.title) + '</strong>' +
      '<span class="scene-intent">' + esc(s.intent) + '</span>' +
      '<span class="scene-meta">' + meta + '</span></a></li>';
  }
  /* 主题卡片：已完成数 */
  var cards = document.querySelectorAll('[data-theme-card]');
  for (var i = 0; i < cards.length; i++) {
    var id = Number(cards[i].getAttribute('data-theme-card'));
    var theme = null;
    for (var j = 0; j < themes.length; j++) if (themes[j].id === id) theme = themes[j];
    var badge = cards[i].querySelector('[data-theme-count]');
    if (!theme || !badge) continue;
    var c = counts[id] || 0;
    var total = themeTotal(theme, c);
    /* 没有完成记录时，也按已归档场景数显示，避免有场景却显示“未开始” */
    if (c > 0) badge.textContent = '已练 ' + c + '/' + total;
    else badge.textContent = total ? total + ' 个场景' : '暂无场景';
    badge.classList.toggle('has', total > 0);
  }

  /* 我的：每个主题进度条 */
  var rows = document.querySelectorAll('[data-progress]');
  for (var r = 0; r < rows.length; r++) {
    var pid = Number(rows[r].getAttribute('data-progress'));
    var pt = null;
    for (var k = 0; k < themes.length; k++) if (themes[k].id === pid) pt = themes[k];
    if (!pt) continue;
    var pc = counts[pid] || 0;
    var pTotal = themeTotal(pt, pc);
    var count = rows[r].querySelector('[data-progress-count]');
    if (count) {
      count.textContent = pTotal ? pc + '/' + pTotal : '暂无场景';
      count.classList.toggle('has', pc > 0);
    }
    var bar = rows[r].querySelector('.progress-bar > span');
    if (bar) bar.style.width = (pTotal ? Math.round(pc / pTotal * 100) : 0) + '%';
  }

  /* 首页：最近练习（最多 3 条）；还没有记录时给一个紧凑空状态 + 直达按钮。 */
  var recentEl = document.getElementById('home-recent');
  if (recentEl) {
    if (completedScenes.length) {
      recentEl.innerHTML = completedScenes.slice(0, 3).map(listItem).join('');
    } else {
      recentEl.innerHTML =
        '<li class="home-empty">' + (icons.clock || '') +
        '<span class="home-empty-txt">还没有完成记录<br>练完一幕后会自动收在这里</span>' +
        '<a class="ghost" href="' + todayHref + '">现在开始</a></li>';
    }
  }

  /* 首页：今日场景卡。分类 chip + 今日推荐 + 场景按钮 + 前 1–2 句台词预览。 */
  var recEl = document.getElementById('today-body');
  if (recEl) {
    function recCard(theme, href, english, chinese, minutes, preview) {
      var pv = (preview || []).map(function (line, i) {
        return '<div class="rec-pv-li"><b>' + (i + 1) + '</b><span>' + esc(line) + '</span></div>';
      }).join('');
      return '<div class="rec-line">' +
        '<span class="rec-cat">' + esc(theme.name) + '</span>' +
        '<span class="rec-tag">今日推荐</span>' +
        (minutes ? '<span class="rec-time">约 ' + minutes + ' 分钟</span>' : '') +
        '</div>' +
        '<a class="rec-scene" href="' + href + '" aria-label="打开场景：' + esc(chinese) + '">' +
        (icons[theme.icon] ? '<span class="icon rec-icon" aria-hidden="true">' + icons[theme.icon] + '</span>' : '') +
        '<span class="rec-titles">' +
        (english ? '<span class="rec-en">' + esc(english) + '</span>' : '') +
        '<span class="rec-zh">' + esc(chinese) + '</span>' +
        '</span>' +
        '<span class="rec-go" aria-hidden="true">' + (icons['chevron-left'] || '') + '</span>' +
        '</a>' +
        (pv ? '<div class="rec-preview" aria-hidden="true">' + pv + '</div>' : '');
    }
    if (nextScene) {
      var sceneTheme = byId[nextScene.theme] || themes[0];
      recEl.innerHTML = recCard(sceneTheme,
        root + 'pages/' + encodeURIComponent(nextScene.file),
        nextScene.englishTitle, nextScene.scene || nextScene.title,
        nextScene.minutes, nextScene.preview);
    } else if (scenes.length) {
      /* 所有场景都练过了 */
      var allTheme = byId[scenes[0].theme] || themes[0];
      recEl.innerHTML = recCard(allTheme, root + 'mine.html', '', '这些场景都练过了', null, []);
    } else if (starterTheme) {
      recEl.innerHTML = recCard(starterTheme, root + 'themes/' + starterTheme.page, '', '今天挑一个新场景', null, []);
    }
  }

  /* 首页：明日预告。只显示下一条真实场景；没有时只留「明日预告 · 主题名」。 */
  var tmrEl = document.getElementById('home-tomorrow');
  if (tmrEl) {
    function tmrCard(themeName, href, name, english) {
      var nameHtml = name
        ? '<span class="tmr-name"><span>' + esc(name) + '</span>' +
          (english ? '<span class="tmr-en">' + esc(english) + '</span>' : '') +
          '</span>'
        : '';
      return '<li class="tomorrow-card">' +
        '<a class="tmr-link" href="' + href + '" aria-label="明日预告：' + esc(name || themeName) + '">' +
        '<span class="icon tmr-icon" aria-hidden="true">' + (icons.chat || '') + '</span>' +
        '<span class="tmr-txt">' +
        '<span class="tmr-label">明日预告 · ' + esc(themeName) + '</span>' +
        nameHtml +
        '</span></a></li>';
    }
    var tmrScene = null;
    var seenToday = false;
    for (var tmi = scenes.length - 1; tmi >= 0; tmi--) {
      if (done[scenes[tmi].file]) continue;
      if (!seenToday) { seenToday = true; continue; }
      tmrScene = scenes[tmi];
      break;
    }
    if (tmrScene) {
      var tmrTheme = byId[tmrScene.theme] || themes[0];
      tmrEl.innerHTML = tmrCard(tmrTheme.name, root + 'pages/' + encodeURIComponent(tmrScene.file),
        tmrScene.scene || tmrScene.title, tmrScene.englishTitle);
    } else if (themes.length) {
      var nextTheme = themes[(dayIndex + 1) % themes.length];
      tmrEl.innerHTML = tmrCard(nextTheme.name, root + 'themes/' + nextTheme.page, '', '');
    }
  }
})();
</script>
